openapi: 3.1.0

info:
    title: Auth API
    version: "1.0.0"
    summary: Authentication and authorization service for the EmberVault project

servers:
    - url: https://embervault.local/auth/api
      description: Local development server

tags:
    - name: Auth
    - name: Password
    - name: Roles

security:
    - bearerAuth: []

paths:
    /me:
        get:
            tags: [ Auth ]
            summary: Get current authenticated user
            operationId: getMe
            responses:
                "200":
                    description: Authenticated user
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/User"
                "401":
                    description: Unauthorized

    /login:
        post:
            tags: [ Auth ]
            security: []
            summary: Login
            operationId: login
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LoginRequest"
            responses:
                "200":
                    description: Login successful
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/AuthResponse"
                                    - $ref: "#/components/schemas/User"
                "400":
                    description: Invalid credentials
                "401":
                    description: Unauthorized

    /logout:
        post:
            tags: [ Auth ]
            summary: Logout
            operationId: logout
            parameters:
                - name: refreshToken
                  in: cookie
                  schema:
                      type: string
            responses:
                "200":
                    description: Logged out successfully

    /register:
        post:
            tags: [ Auth ]
            security: []
            summary: Register new user
            operationId: register
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/RegisterRequest"
            responses:
                "200":
                    description: User registered
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/AuthResponse"
                                    - $ref: "#/components/schemas/User"
                "400":
                    description: Validation error

    /refresh:
        post:
            tags: [ Auth ]
            summary: Refresh access token
            operationId: refreshToken
            security: []
            parameters:
                - name: refreshToken
                  in: cookie
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Token refreshed
                    content:
                        application/json:
                            schema:
                                allOf:
                                    - $ref: "#/components/schemas/AuthResponse"
                                    - $ref: "#/components/schemas/User"
                "401":
                    description: Invalid refresh token

    /change-password:
        post:
            tags: [ Password ]
            summary: Change password
            operationId: changePassword
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ChangePasswordRequest"
            responses:
                "200":
                    description: Password changed
                "400":
                    description: Validation error
                "401":
                    description: Unauthorized

    /forgot-password:
        post:
            tags: [ Password ]
            summary: Request password reset
            operationId: forgotPassword
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ForgotPasswordRequest"
            responses:
                "200":
                    description: Reset email sent
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ForgotPasswordResponse"
                "400":
                    description: Invalid request
                "500":
                    description: Server error

    /reset-password:
        post:
            tags: [ Password ]
            summary: Reset password
            operationId: resetPassword
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ResetPasswordRequest"
            responses:
                "200":
                    description: Password reset
                "400":
                    description: Invalid request
                "500":
                    description: Server error

    /users/roles:
        get:
            tags: [ Roles ]
            summary: Get current user's roles
            operationId: getMyRoles
            responses:
                "200":
                    description: List of roles
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        name:
                                            type: string
                                        description:
                                            type: string
                "401":
                    description: Unauthorized

    /users/{userId}/roles:
        get:
            tags: [ Roles ]
            summary: Get user's system role
            operationId: getUserRoles
            parameters:
                - $ref: "#/components/parameters/UserId"
            responses:
                "200":
                    description: User roles
                    content:
                        application/json:
                            schema:
                                type: string
                "400":
                    description: Bad request
                "401":
                    description: Unauthorized
                "500":
                    description: Server error

    /users/{userId}/roles/{role}:
        post:
            tags: [ Roles ]
            summary: Assign role to user
            operationId: assignUserRole
            parameters:
                - $ref: "#/components/parameters/UserId"
                - $ref: "#/components/parameters/Role"
            responses:
                "200":
                    description: Role assigned
                "401":
                    description: Unauthorized
                "500":
                    description: Server error

    /resource/{resourceId}/roles:
        get:
            tags: [ Roles ]
            summary: Get roles for resource
            operationId: getResourceRoles
            parameters:
                - $ref: "#/components/parameters/ResourceId"
            responses:
                "200":
                    description: Resource roles
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/UserResourcePermissions"
                "400":
                    description: Bad request
                "401":
                    description: Unauthorized

    /resource/{resourceId}/roles/{userId}:
        get:
            tags: [ Roles ]
            summary: Get user's role on resource
            operationId: getUserResourceRole
            parameters:
                - $ref: "#/components/parameters/ResourceId"
                - $ref: "#/components/parameters/UserId"
            responses:
                "200":
                    description: User role
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserResourcePermissions"
                "400":
                    description: Bad request
                "401":
                    description: Unauthorized
                "500":
                    description: Server error

        post:
            tags: [ Roles ]
            summary: Assign role to user on resource
            operationId: assignResourceRole
            parameters:
                - $ref: "#/components/parameters/ResourceId"
                - $ref: "#/components/parameters/UserId"
            responses:
                "200":
                    description: Role assigned
                "400":
                    description: Bad request
                "401":
                    description: Unauthorized
                "500":
                    description: Server error

        delete:
            tags: [ Roles ]
            summary: Remove user role from resource
            operationId: removeResourceRole
            parameters:
                - $ref: "#/components/parameters/ResourceId"
                - $ref: "#/components/parameters/UserId"
            responses:
                "200":
                    description: Role removed
                "400":
                    description: Bad request
                "401":
                    description: Unauthorized
                "500":
                    description: Server error
    
    /resource/roles:
        get:
            tags: [ Roles ]
            summary: Get all resource roles
            operationId: getAllResourceRoles
            responses:
                "200":
                    description: List of resource roles
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
                                    properties:
                                        id:
                                            type: string
                                        name:
                                            type: string
                                        description:
                                            type: string
                "401":
                    description: Unauthorized
                "500":
                    description: Server error

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    parameters:
        UserId:
            name: userId
            in: path
            required: true
            schema:
                type: string

        Role:
            name: role
            in: path
            required: true
            schema:
                type: string

        ResourceId:
            name: resourceId
            in: path
            required: true
            schema:
                type: string

    schemas:
        User:
            type: object
            required: [ id ]
            properties:
                id:
                    type: string
                username:
                    type: string
                email:
                    type: string
            oneOf:
                - required: [ username ]
                - required: [ email ]

        AuthResponse:
            type: object
            required: [ accessToken ]
            properties:
                accessToken:
                    type: string

        LoginRequest:
            type: object
            required: [ password ]
            properties:
                username:
                    type: string
                email:
                    type: string
                password:
                    type: string

        RegisterRequest:
            type: object
            required: [ username, email, password, confirmPassword ]
            properties:
                username:
                    type: string
                email:
                    type: string
                password:
                    type: string
                confirmPassword:
                    type: string
                birthDate:
                    type: string
                    format: date

        ChangePasswordRequest:
            type: object
            required: [ oldPassword, newPassword, confirmNewPassword ]
            properties:
                oldPassword:
                    type: string
                newPassword:
                    type: string
                confirmNewPassword:
                    type: string

        ForgotPasswordRequest:
            type: object
            required: [ email ]
            properties:
                email:
                    type: string

        ForgotPasswordResponse:
            type: object
            required: [ id ]
            properties:
                id:
                    type: string

        ResetPasswordRequest:
            type: object
            required: [ code, newPassword ]
            properties:
                code:
                    type: string
                newPassword:
                    type: string

        UserResourcePermissions:
            type: object
            properties:
                userId:
                    type: string
                resourceRoleId:
                    type: string
                roleName:
                    type: string
                username:
                    type: string
                email:
                    type: string
                resourceName:
                    type: string

x-internal: true
