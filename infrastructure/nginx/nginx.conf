events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream auth_service {
        server auth:3100;
    }
    upstream user_service {
        server user:3200;
    }
    upstream media_service {
        server media:3300;
    }
    upstream seaweedfs_s3_service {
        server seaweedfs-s3:8333;
    }

    # Redirect HTTP -> HTTPS
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;

        ssl_certificate     /etc/nginx/certs/embervault.crt;
        ssl_certificate_key /etc/nginx/certs/embervault.key;

        location ^~ /user/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://user_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /media/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://media_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Expose SeaweedFS S3 objects behind the same HTTPS origin to avoid mixed-content avatar URLs.
        location ^~ /s3/ {
            proxy_pass http://seaweedfs_s3_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /auth/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        location ~* \.(js|css|png|jpg|svg|ico|woff2|webp)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}