services:
    postgres:
        image: postgres:15-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            DB_BACKEND_USER: ${DB_BACKEND_USER}
            DB_BACKEND_PASSWORD: ${DB_BACKEND_PASSWORD}
            DB_ADMIN_USER: ${DB_ADMIN_USER}
            DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infrastructure/db:/docker-entrypoint-initdb.d
        networks:
            - backend

    auth:
        build:
            context: ./EmberVault/services/auth
            secrets:
                - auth_lib_token
        container_name: auth-service
        ports:
            - 3100:3100
        depends_on:
            - postgres
        networks:
            - backend
    
    user:
        build:
            context: ./EmberVault/services/user
            secrets:
                - auth_lib_token
        container_name: user-service
        ports:
            - 3200:3200
        depends_on:
            - postgres
        networks:
            - backend
    minio:
        image: minio/minio:RELEASE.2025-07-23T15-54-02Z
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
            interval: 10s
            timeout: 60s
            retries: 10
        volumes:
            - minio-data:/data

    minio-init:
        image: minio/mc:RELEASE.2025-07-21T05-28-08Z
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
            MINIO_HOST: ${MINIO_HOST}
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set embervault $MINIO_HOST $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD 
            && mc mb -p embervault/files || true"

volumes:
    postgres_data:
    minio-data:

networks:
    backend:
        driver: bridge

secrets:
  auth_lib_token:
    environment: AUTH_LIB_TOKEN
